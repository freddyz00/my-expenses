<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Basic Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Simple and elegant expense tracking app for managing your personal finances" />
    <meta name="keywords" content="expenses, finance, budget, money, tracker, personal finance" />
    <meta name="author" content="My Expenses App" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#F6F7F9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="My Expenses" />
    
    <!-- Apple Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My Expenses" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72.png" />
    
    <!-- Apple Touch Icons (PNG required for iOS) -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/icons/icon-96.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/icons/icon-72.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/icons/icon-72.png" />
    <link rel="apple-touch-icon" sizes="57x57" href="/icons/icon-72.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#F6F7F9" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <title>My Expenses - Personal Finance Tracker</title>
    
    <!-- iOS Keyboard Fix Styles -->
    <style>
      /* Prevent page scrolling on iOS when keyboard opens */
      html, body {
        position: fixed;
        overflow: hidden;
        width: 100%;
        height: 100%;
        -webkit-overflow-scrolling: touch;
      }
      
      #root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      /* Allow scrolling within specific containers */
      .overflow-auto {
        -webkit-overflow-scrolling: touch;
      }
      
      /* iOS specific fixes */
      @supports (-webkit-touch-callout: none) {
        /* iOS Safari */
        body {
          height: 100vh;
          height: -webkit-fill-available;
        }
        
        #root {
          height: 100vh;
          height: -webkit-fill-available;
        }
        
        /* Prevent zoom on input focus */
        input, textarea, select {
          font-size: 16px !important;
        }
        
        /* Better touch feedback for iOS without jumping */
        button, .button {
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
          -webkit-user-select: none;
          user-select: none;
        }
        
        /* Smooth transitions for active states */
        button:active, .button:active {
          transition: all 0.1s ease-out;
        }
      }
      
      /* Handle viewport height changes */
      :root {
        --vh: 1vh;
      }
      
      .viewport-height {
        height: 100vh;
        height: calc(var(--vh, 1vh) * 100);
        height: 100dvh; /* Dynamic viewport height for modern browsers */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- iOS Keyboard Handling Script -->
    <script>
      // Handle iOS keyboard viewport changes
      function handleViewportChange() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
        
        // Update viewport height class elements
        const viewportElements = document.querySelectorAll('.viewport-height');
        viewportElements.forEach(el => {
          el.style.height = `${window.innerHeight}px`;
        });
      }
      
      // Initial setup
      handleViewportChange();
      
      // Listen for viewport changes (keyboard open/close)
      window.addEventListener('resize', handleViewportChange);
      window.addEventListener('orientationchange', () => {
        setTimeout(handleViewportChange, 100);
      });
      
      // iOS specific handling
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        // Prevent scrolling on iOS
        document.addEventListener('touchmove', function(e) {
          if (e.target.closest('input, textarea, select')) {
            return; // Allow scrolling within form elements
          }
          e.preventDefault();
        }, { passive: false });
        
        // Handle focus events to prevent zoom
        document.addEventListener('focusin', function(e) {
          if (e.target.matches('input, textarea, select')) {
            // Temporarily adjust viewport to prevent zoom
            const viewport = document.querySelector('meta[name=viewport]');
            const originalContent = viewport.getAttribute('content');
            viewport.setAttribute('content', originalContent + ', maximum-scale=1.0');
            
            setTimeout(() => {
              viewport.setAttribute('content', originalContent);
            }, 100);
          }
        });
      }
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
